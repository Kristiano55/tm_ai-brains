name: Check pack submission
# pull_request_target: the workflow and the validator come from main (a pull request cannot change them).
# The pull request's files are checked out separately and only READ as data; nothing from them is run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Hub tools (trusted, main)
        uses: actions/checkout@v4
        with:
          path: base
          persist-credentials: false
      - name: Pull request files (data only)
        uses: actions/checkout@v4
        with:
          path: head
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3 jsonschema==4.23.0
      - name: Validate
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python base/tools/validate_pr.py --base base --head head --author "$PR_AUTHOR"
